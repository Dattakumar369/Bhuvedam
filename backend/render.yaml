services:
  - type: web
    name: bhuvedam-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_API_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gpt-oss:20b
      - key: DATA_GOV_API_KEY
        sync: false
      - key: TWOFACTOR_API_KEY
        sync: false
      - key: OTP_PEPPER
        generateValue: true
      - key: OTP_DEV_MODE
        value: "false"
